[package]
name = "manga_dl"
version = "0.2.1"
edition = "2021"

[dependencies]
base64 = "0.22.1"
clap = { version = "4.5.20", features = ["derive"] }
color-eyre = { version = "0.6.3", default-features = false, features = ["track-caller"] }
fancy-regex = "0.14.0"
fantoccini = "0.21.2"
futures-util = "0.3.31"
pretty_assertions = "1.4.1"
rayon = "1.10.0"
regex = { version = "1.11.1", features = ["use_std"] }
reqwest = "0.12.9"
serde = "1.0.214"
serde_json = "1.0.132"
snafu = "0.8.5"
spinners = "4.1.1"
thiserror = "2.0.1"
tokio = { version = "1.41.1", features = ["full"] }

[build-dependencies]
embed-resource = "3.0.1"

[rust-toolchain]
channel = "nightly"
